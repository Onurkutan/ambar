name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job here needs to write anything back to the repository -- read-only is
# the least this token could be and still do its job, so it is what it gets.
permissions:
  contents: read

jobs:
  # Correctness under the two compilers that disagree most about what is legal.
  linux:
    name: linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        # Warnings are errors here rather than in CMakeLists, so a local build
        # stays workable while CI stays strict.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build

      - name: Test
        # -v names each test before it runs, so a test that crashes the process
        # rather than failing a check can be identified from the log.
        run: ./build/ambar_tests -v

  # The build nobody runs locally, which is exactly why it belongs in CI: MSVC
  # rejects things gcc and clang accept, and finds them the moment they appear
  # rather than at the end of the project.
  windows:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=/WX
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: .\build\Release\ambar_tests.exe -v

  # Memory errors.  A storage engine hands out pointers into arenas and mapped
  # buffers; this is the job that notices when one outlives what it points at.
  sanitize-address:
    name: sanitizers / address + undefined
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAMBAR_SANITIZE=address
      - run: cmake --build build
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./build/ambar_tests -v

      # Damaged and hostile files, specifically. A table file is untrusted
      # input, and the checks that keep a malformed one from reading out of
      # bounds are only meaningful when something is watching for it.
      - name: Corruption suite under the sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/ambar_tests -v corrupt.

  # The skip list claims to be safe for one writer and many readers, and the
  # database claims many readers alongside a compaction thread.  This is the
  # job that decides whether either is true.
  #
  # Its value is checked by mutation rather than assumed: relaxing the
  # acquire/release pair in skiplist.hpp is mutations/skiplist.json, and this
  # job is what turns red for it.
  sanitize-thread:
    name: sanitizers / thread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAMBAR_SANITIZE=thread
      - run: cmake --build build
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ./build/ambar_tests

  # A crash is not a slow test, it is a different test: everything above runs
  # the engine to completion, and the durability claims are all of the form
  # "if the process dies here, then afterwards ...".
  crash:
    name: crash injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - name: Kill a writer at random instants and verify what survived
        run: ./build/ambar_crash_test "$RUNNER_TEMP/crash" run 12

      # And the failures a kill cannot produce: one I/O call returning EIO, at
      # every point in a workload where it would matter.
      - name: Fail one fsync at a time across every manifest write
        run: ./tools/fault_sweep.sh build 2

      # And the one a kill cannot produce either: the disk losing what was
      # not synced.  The unit suite runs a few hundred cuts on every platform;
      # this runs a few thousand under the two least forgiving models.
      - name: Cut the power a few thousand times on a simulated disk
        run: |
          ./build/ambar_powercut --dirents posix --tails holes --seeds 6 --cycles 250
          ./build/ambar_powercut --dirents posix --tails garbage --seeds 6 --cycles 250

  # Everything above feeds the engine files it wrote itself, or files damaged
  # by hand in ways somebody thought of.  This feeds each parser of untrusted
  # bytes -- table, block, filter, log, batch, manifest -- inputs nobody thought
  # of, under ASan and UBSan, starting from a valid example of each format.
  #
  # A minute per target is a smoke test, not a campaign: it catches the
  # shallow bugs and any regression in the deep ones a longer local run found.
  fuzz:
    name: fuzz / libFuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAMBAR_FUZZ=ON
          -DCMAKE_CXX_FLAGS=-Werror
      - run: cmake --build build --target fuzzers
      - name: Seed every corpus from the engine's own writers
        run: ./build/fuzz_seeds corpus
      - name: Fuzz each parser for a minute
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: |
          mkdir -p crashes
          for target in version_edit block filter_block write_batch table wal; do
            echo "::group::fuzz_$target"
            ./build/fuzz_$target \
              -max_total_time=60 -max_len=16384 -timeout=20 \
              -artifact_prefix="crashes/$target-" \
              "corpus/$target"
            echo "::endgroup::"
          done
      # A crash is only useful if somebody can reproduce it.  The input that
      # caused it is the whole bug report.
      - name: Keep any input that crashed a parser
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: crashes/
          if-no-files-found: ignore
